<!doctype html><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css"><style>*{margin:0;box-sizing:border-box}body{font-family:var(--font-ui);background:var(--paper-300);padding:18px}</style>
<div style="display:flex;flex-direction:column;gap:10px;max-width:340px">
  <button style="font-family:var(--font-ui);font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:.14em;border:0;padding:16px 22px;border-radius:10px;background:var(--terracotta-500);color:var(--on-dark)">Repeat Payment</button>
  <button style="font-family:var(--font-ui);font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:.14em;border:0;padding:16px 22px;border-radius:10px;background:var(--forest-700);color:var(--on-dark)">Show More</button>
  <button style="font-family:var(--font-ui);font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:.14em;padding:16px 22px;border-radius:10px;background:transparent;border:1px solid var(--ink-strong);color:var(--ink-strong)">Show More</button>
</div>
